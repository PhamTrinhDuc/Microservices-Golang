services:
  # PostgreSQL with pgvector extension
  postgres:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: mcp_password
      POSTGRES_DB: salon_chain
    ports:
      - "5433:5432"
    volumes:
      # Sửa từ /var/lib/postgresql/data thành /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
      - ./docker.config/database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_user -d salon_chain"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcp-network
      
  # Redis for rate limiting and caching
  redis:
    image: redis:7.2-alpine
    # container_name: mcp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker.config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "redis://jiyuu:a2amcpgo@localhost:6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcp-network

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    # container_name: mcp-jaeger
    ports:
      - "5775:5775/udp"   # accept zipkin.thrift over compact thrift protocol
      - "6831:6831/udp"   # accept jaeger.thrift over compact thrift protocol
      - "6832:6832/udp"   # accept jaeger.thrift over binary thrift protocol
      - "5778:5778"       # serve configs
      - "16686:16686"     # serve frontend (UI)
      - "14268:14268"     # accept jaeger.thrift directly from clients
      - "14250:14250"     # accept model.proto
      - "9411:9411"       # Zipkin compatible endpoint
      - "4317:4317"       # OTLP gRPC receiver
      - "4318:4318"       # OTLP HTTP receiver
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - mcp-network

