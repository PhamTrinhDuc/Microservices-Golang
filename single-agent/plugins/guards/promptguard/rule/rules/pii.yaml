# guards/rule/rules/pii.yaml
name: pii
rules:
  - name: pii_ssn_us
    apply_to_input: true
    apply_to_output: true
    verdict: unsafe
    tags: [pii]
    patterns:
      - '\b\d{3}-\d{2}-\d{4}\b'

  - name: pii_phone_vn
    apply_to_input: true
    apply_to_output: true
    verdict: unsafe
    tags: [pii]
    patterns:
      - '(0|\+84)(3[2-9]|5[6-9]|7[06-9]|8[0-9]|9[0-9])\d{7}'

  - name: pii_credit_card
    apply_to_input: true
    apply_to_output: true
    verdict: unsafe
    tags: [pii]
    patterns:
      - '\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14})\b'